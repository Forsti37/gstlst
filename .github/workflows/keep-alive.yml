# Supabase pauses free projects after 7 days without activity, so query the database every 3 days.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a lightweight query against prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::Supabase secrets are not set yet, skipping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/genres?select=id&limit=1")
          echo "HTTP $status"
          # 404 only means the genres table doesn't exist yet: it arrives in phase 1.
          # Phase 1 should narrow this to 200 only.
          case "$status" in
            200|404) exit 0 ;;
            *) echo "::error::Keep-alive query failed with HTTP $status"; exit 1 ;;
          esac
