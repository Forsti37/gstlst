# Supabase pauses free projects after 7 days without activity, so query the database every 3 days.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a lightweight query against prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::Supabase secrets are not set yet, skipping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive query failed with HTTP $status"
            exit 1
          fi
